<!DOCTYPE html>

    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050505;
            color: #39ff14; /* Neon green */
            margin: 0;
            overflow-x: hidden;
        }

        /* CRT Screen effect */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .terminal-box {
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2), inset 0 0 20px rgba(57, 255, 20, 0.1);
            border: 1px solid rgba(57, 255, 20, 0.5);
            background-color: #0a0f0a;
        }

        .btn-terminal {
            background: transparent;
            border: 1px solid #39ff14;
            color: #39ff14;
            transition: all 0.2s ease-in-out;
        }

        .btn-terminal:hover {
            background: #39ff14;
            color: #050505;
            box-shadow: 0 0 10px #39ff14;
        }

        .btn-terminal.deny {
            border-color: #ff3333;
            color: #ff3333;
        }
        
        .btn-terminal.deny:hover {
            background: #ff3333;
            color: #050505;
            box-shadow: 0 0 10px #ff3333;
        }

        .typing-effect {
            overflow: hidden;
            white-space: pre-wrap;
            margin: 0 auto;
            letter-spacing: .05em;
        }

        /* Blinking cursor */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #39ff14;
            animation: blink 1s step-end infinite;
            vertical-align: bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Glitch effect for rebels */
        .glitch {
            position: relative;
            color: #ff3333;
            animation: glitch-skew 1s infinite linear alternate-reverse;
        }
        
        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(-10deg); }
            40% { transform: skew(10deg); }
            60% { transform: skew(-5deg); }
            80% { transform: skew(5deg); }
            100% { transform: skew(0deg); }
        }
    </style>

        const contentArea = document.getElementById('content-area');

        let typingTimeout;

        function typeText(text, element, speed = 20) {
            element.innerHTML = '';
            let i = 0;
            
            // Allow HTML inside the text by temporarily hiding the typing effect for HTML tags
            element.innerHTML = text; 
            // Note: For a true typing effect with HTML, we'd need a more complex parser. 
            // For this cyber-terminal, a quick reveal or simple insertion works best to not break tags.
            // Let's simulate a quick data load instead of letter-by-letter to support HTML securely.
            
            element.classList.add('opacity-0');
            setTimeout(() => {
                element.classList.remove('opacity-0');
                element.classList.add('transition-opacity', 'duration-500');
            }, 50);
        }

        function loadScreen(screenId) {
            const screen = gameData[screenId];
            if (!screen) return;

            // Clear controls temporarily
            controlsArea.innerHTML = '';

            // Render Text
            const textContainer = document.createElement('div');
            textContainer.className = 'typing-effect text-sm sm:text-base md:text-lg flex-grow whitespace-pre-wrap';
            contentArea.innerHTML = '';
            contentArea.appendChild(textContainer);
            
            typeText(screen.text, textContainer);

            // Add cursor
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            textContainer.appendChild(cursor);

            // Render Buttons with a slight delay
            setTimeout(() => {
                screen.buttons.forEach(btn => {
                    const button = document.createElement('button');
                    button.className = `p-3 w-full text-left font-bold tracking-wider rounded uppercase ${btn.class}`;
                    button.innerText = btn.label;
                    button.onclick = () => loadScreen(btn.target);
                    controlsArea.appendChild(button);
                });
            }, 600); // Delay buttons until text "loads"
        }

        // Initialize game
        window.onload = () => {
            loadScreen('boot');
        };
